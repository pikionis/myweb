# Builds the site and publishes it on GitHub Pages (onehublabs.com) on every push to main,
# and once a day so the GitHub terrain on /about and the projects' PageSpeed results stay current.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # measures the live projects for /projects (PageSpeed Insights); without the key, or if Google can't be
      # reached, the saved results stay
      - run: npm run pagespeed
        env:
          PSI_KEY: ${{ secrets.PSI_KEY }}
      # prebuild pulls the GitHub calendar first. The measuring and ad tags come from repository variables (Settings →
      # Secrets and variables → Actions → Variables); any left empty is simply not on the site (src/data/tracking.ts)
      - run: npm run build
        env:
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          GOOGLE_ADS_ID: ${{ vars.GOOGLE_ADS_ID }}
          GOOGLE_ADS_LEAD_LABEL: ${{ vars.GOOGLE_ADS_LEAD_LABEL }}
          META_PIXEL_ID: ${{ vars.META_PIXEL_ID }}
          TIKTOK_PIXEL_ID: ${{ vars.TIKTOK_PIXEL_ID }}
          LINKEDIN_PARTNER_ID: ${{ vars.LINKEDIN_PARTNER_ID }}
          LINKEDIN_LEAD_CONVERSION_ID: ${{ vars.LINKEDIN_LEAD_CONVERSION_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
